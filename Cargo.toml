[workspace]
resolver = "3"
members = ["crates/dbrief-core", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
dbrief-core = { path = "crates/dbrief-core" }

async-trait = "0.1"
keyring = "4"
percent-encoding = "2"
rcgen = "0.14"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
specta-typescript = "=0.0.13"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "sqlite", "postgres", "migrate", "macros"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
